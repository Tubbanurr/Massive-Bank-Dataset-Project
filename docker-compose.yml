

services:
  # ==================== ZOOKEEPER ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KAFKA BROKER ====================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==================== KAFKA PRODUCER ====================
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: kafka-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bank-transactions
      MESSAGE_RATE: 50  # mesaj/saniye (10-100 arası ayarlanabilir)
      BATCH_SIZE: 100
    volumes:
      - ./dataset:/app/dataset
      - ./producer:/app/producer
    networks:
      - bank-network

  # ==================== SPARK MASTER ====================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master port
      - "4040:4040"  # Spark Application UI
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    volumes:
      - ./dataset:/app/dataset
      - ./spark:/app/spark
      - ./delta-lake:/app/delta-lake
      - ./mlruns:/app/mlruns
      - ./output:/app/output
    command: >
      bash -c "
        /opt/spark/sbin/start-master.sh && 
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-*.out
      "
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== SPARK WORKER ====================
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"  # Spark Worker Web UI
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./dataset:/app/dataset
      - ./spark:/app/spark
      - ./delta-lake:/app/delta-lake
      - ./mlruns:/app/mlruns
      - ./output:/app/output
    command: >
      bash -c "
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && 
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-*.out
      "
    networks:
      - bank-network

  # ==================== SPARK STREAMING JOB ====================
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-streaming
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bank-transactions
      DELTA_LAKE_PATH: /app/delta-lake
    volumes:
      - ./dataset:/app/dataset
      - ./spark:/app/spark
      - ./delta-lake:/app/delta-lake
      - ./mlruns:/app/mlruns
      - ./output:/app/output
    command: >
      bash -c "chmod +x /app/spark/spark_streaming.py && 
      echo 'Waiting for Kafka topic to be ready...' && 
      sleep 30 && 
      /opt/spark/bin/spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-spark_2.12:3.2.0 --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog --conf spark.driver.memory=1g --conf spark.executor.memory=1g /app/spark/spark_streaming.py"
    networks:
      - bank-network

  # ==================== MLFLOW SERVER ====================
  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      bash -c "
        pip install mlflow --quiet &&
        mlflow server
          --backend-store-uri file:///mlflow/mlruns
          --default-artifact-root file:///mlflow/mlruns
          --host 0.0.0.0
          --port 5000
      "
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==================== DASHBOARD (Streamlit) ====================
  dashboard:
    image: python:3.11-slim
    container_name: dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./output:/app/output
      - ./mlruns:/app/mlruns
      - ./delta-lake:/app/delta-lake
    command: >
      bash -c "
        pip install streamlit pandas matplotlib seaborn plotly scikit-learn mlflow --quiet &&
        cd /app &&
        streamlit run dashboard/dashboard.py --server.address 0.0.0.0 --server.port 8501
      "
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge
